# classify-events — the Gemma clinical-event cascade Function (the GPU showcase).
#
# The transform-runtime showcase RFC 0076 elevates beyond routing: an open-weight
# Gemma cascade (vLLM, guided decoding) on the GPU pool, KEDA scale-to-zero,
# reading each note ONCE and writing back clinical events — medication
# discontinuation the headline — plus the derived facet labels in the same pass
# (one GPU pass, many labels). The cascade design is RFC 0072 (moment); this is
# its first built instance, specialized to clinical events.
#
# Contrast with moment's deployed enrichment (pool: cpu, rule-based): this is
# pool: gpu, model-served. The `discovery` + `write` triggers backfill existing
# rows and enrich new ones; `filter: events Eq null` claims only un-classified
# notes so a re-run is cheap.
apiVersion: hevlayer.com/v1alpha1
kind: Function
metadata:
  name: chart-classify-events
  namespace: chart
spec:
  paused: false                         # Layer owns scale-to-zero; filter resumes safely
  targetNamespaces: [chart-notes]
  inputs: [id, text]
  version: v1
  filter: ["events", "Eq", null]      # only notes not yet classified
  triggers: [discovery, write]
  worker:
    # GPU image with vLLM + the Gemma weights cache (the `classifier` extra).
    # No computeClass: scaling.pool below pins the GPU pool, and the operator's
    # gateway-registration equality check chokes on the redundant field
    # (hev/layer#148 — the gateway strips it, so re-registration 409s forever).
    image: 186219257916.dkr.ecr.us-east-1.amazonaws.com/mesh:chart-classifier-plan-20260702-batched3
    batchSize: 16                       # claim size; the worker keeps vLLM resident
                                        # and patches derived labels via tpuf.
    timeoutSeconds: 1200
    podSpec:
      containers:
        - name: udf
          command: ["uv", "run", "python", "-m", "functions.classify_events"]
          env:
            - name: CHART_EVENTS_MODEL
              value: google/gemma-2-9b-it     # open weights, A10G-fit (RFC 0072)
            # FlashInfer JIT-compiles CUDA kernels at engine start and needs nvcc,
            # which the runtime CUDA base doesn't ship (exit 127 → EngineCore death
            # loop). Fall back to the PyTorch-native sampler.
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "0"
            # The lease must outlast one whole batched generate() over a claim.
            - name: HEVLAYER_UDF_LEASE_SECONDS
              value: "600"
            - name: LAYER_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chart-gateway
                  key: LAYER_GATEWAY_API_KEY
            # gemma-2-9b-it is gated on HF and the image's bake-time preload is
            # skipped without a build token (the /models cache ships empty), so
            # the worker downloads weights at startup — authenticated, or it
            # gets anonymous 429s and then the gated-repo wall.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chart-huggingface
                  key: HF_TOKEN
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chart-huggingface
                  key: HF_TOKEN
  scaling:
    pool: gpu                           # the one Function on the GPU pool
    mode: autoscale
    warmWindowSeconds: 600
    replicas: { min: 0, max: 2 }        # scale-to-zero; bursts on backfill
