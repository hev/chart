# Example only. Do not apply this file as-is and never commit real credentials.
# Create these Secrets in namespace `chart` before `scripts/deploy_apply.sh --apply`.
#
# chart-hevsearch: the hev search engine's own tokens (deploy/hevsearch-engine.yaml
#   + deploy/vectorstore.yaml). Upstream-only — no app code ever sees them.
# chart-layer-inbound: the Layer-issued inbound key the gateway accepts for the
#   chart-notes scope (deploy/vectorstore.yaml inboundAuth.keys).
# chart-gateway: the same inbound key, as the env the in-cluster workers load
#   (LAYER_GATEWAY_API_KEY in pipeline-embed.yaml / functions-events.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: chart-hevsearch
  namespace: chart
type: Opaque
stringData:
  data-api-key: REPLACE_WITH_HEVSEARCH_DATA_KEY
  admin-api-key: REPLACE_WITH_HEVSEARCH_ADMIN_KEY
  metrics-token: REPLACE_WITH_HEVSEARCH_METRICS_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: chart-layer-inbound
  namespace: chart
type: Opaque
stringData:
  api-key: REPLACE_WITH_LAYER_INBOUND_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: chart-gateway
  namespace: chart
type: Opaque
stringData:
  LAYER_GATEWAY_API_KEY: REPLACE_WITH_LAYER_GATEWAY_API_KEY
