# VectorStore — the gateway's upstream connection + inbound auth policy.
#
# Declarative equivalent of chart_common/gateway.py:make_client() — the base URL
# + bearer token the indexer and search backends pass at runtime. In a full
# cluster the gateway reads this CR instead.
#
# Currently kind=turbopuffer — matches the CR actually applied in the `chart`
# namespace (`turbopuffer-default`, created 2026-06-25). A kind=search cutover
# was attempted (hev/layer#134) but the search-kind manifest was never actually
# applied to this namespace; the namespace is still live on Turbopuffer, so this
# file was reverted to match reality rather than leave the repo describing a
# backend the cluster isn't using. See docs/kubernetes/vectorstore-crd in
# ../layer before re-attempting the cutover.
apiVersion: hevlayer.com/v1alpha1
kind: VectorStore
metadata:
  name: turbopuffer-default
  namespace: chart
spec:
  kind: turbopuffer
  default: true
  endpoint:
    url: https://aws-us-east-1.turbopuffer.com
    region: aws-us-east-1
  credential:
    secretRef:
      name: chart-turbopuffer
      key: credential
  inboundAuth:
    mode: deriveFromStore
