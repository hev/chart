# VectorStore — the gateway's upstream connection + inbound auth policy.
#
# Declarative equivalent of chart_common/gateway.py:make_client() — the base URL
# + bearer token the indexer and search backends pass at runtime. In a full
# cluster the gateway reads this CR instead. For kind=search, inbound auth uses
# Layer-issued scoped keys so the hev search data/admin tokens stay upstream-only
# (the credentials live in a Secret, never in the CR or this repo). See
# docs/kubernetes/vectorstore-crd in ../layer and the shelf cutover (hev/layer#134).
apiVersion: hevlayer.com/v1alpha1
kind: VectorStore
metadata:
  name: search-default
  namespace: chart
spec:
  kind: search
  default: true
  endpoint:
    url: http://hevsearch.chart.svc.cluster.local:3000
    region: aws-us-east-1
  search:
    adminCredential:
      secretRef:
        name: chart-hevsearch
        key: admin-api-key
  credential:
    secretRef:
      name: chart-hevsearch
      key: data-api-key
  inboundAuth:
    mode: keys
    keys:
      - name: chart-notes
        scopes: [read, write]
        secretRef:
          name: chart-layer-inbound
          key: api-key
