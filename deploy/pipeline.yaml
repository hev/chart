# Pipeline — staged ingestion declared as config.
#
# Declarative equivalent of `uv run python -m indexer` (load → embed → upsert).
# The Warehouse (deploy/warehouse.yaml) is identity; this sourceRef is the
# *what*: dataset, split, pinned revision, and the column → attribute mapping.
# The source worker streams the pinned Hugging Face dataset revision and stages
# records into the Layer pipeline. The live CRD requires `spec.worker.image`, so
# keep the ECR-hosted source worker explicit.
#
# CHUNKING — the one ingestion stage worth getting right (RFC 0076 § Chunking).
# notesearch chunks with LangChain RecursiveCharacterTextSplitter at 1000 chars /
# 200 overlap: character-based (splits mid-sentence, blind to note structure) and
# only ~200–250 tokens, under half the Arctic 512-token window. We improve on it:
#   - token-based, sized to the embedder's 512-token max (Arctic silently
#     truncates past it — a correctness point, not just recall);
#   - clinical-section-aware splitting (the EDGAR `section` strategy, RFC 0067,
#     specialized to clinical-note headings), recursing only when a section
#     exceeds the window. Most PMC summaries are one section-window chunk.
apiVersion: hevlayer.com/v1alpha1
kind: Pipeline
metadata:
  name: chart-ingest
  namespace: chart
spec:
  pipelineId: chart-notes
  target:
    namespace: chart-notes
  worker:
    image: 186219257916.dkr.ecr.us-east-1.amazonaws.com/mesh:chart-huggingface-source-plan-20260626-httpx2
    computeClass: cpu
    timeoutSeconds: 7200
    podSpec:
      containers:
        - name: worker
          command: ["uv", "run", "python", "-m", "source.huggingface_source"]
          env:
            - name: LAYER_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chart-gateway
                  key: LAYER_GATEWAY_API_KEY
            - name: CHART_HF_SOURCE_WRITE_CONCURRENCY
              value: "4"
            - name: CHART_HF_SOURCE_PAGE_SIZE
              value: "25"
            - name: CHART_HF_SOURCE_START_OFFSET
              value: "0"
            - name: CHART_HF_SOURCE_MAX_ROWS
              value: "0"
  sourceRef:
    kind: huggingface
    warehouseRef: pmc-patients-hub
    dataset: zhengyun21/PMC-Patients
    split: train
    # Exact commit the indexer reads (config.py:dataset_revision) and the ReCDS
    # qrels (eval/) were built against.
    revision: 28d8836518f86d4f1e6358ea8ec09977023e5766
    mapping:
      id: patient_uid
      text: patient                       # the case-summary note text
      attributes: [patient_uid, PMID, title, age, gender]
    chunk:
      strategy: section                    # split on clinical-note sections, then recurse
      unit: tokens
      size: 512                            # Arctic-embed-m-v1.5 max sequence length
      overlap: 64
      tokenizer: snowflake-arctic-embed-m-v1.5   # the embedder's own tokenizer
  scaling:
    pool: cpu
    mode: autoscale
    replicas:
      min: 0
      max: 4
# Embedding (Snowflake/snowflake-arctic-embed-m-v1.5, 768-d) is the GPU follow-on
# stage in pipeline-embed.yaml. The local indexer does bounded slice embedding
# inline; the full Phase-6 run uses that GPU Pipeline.
